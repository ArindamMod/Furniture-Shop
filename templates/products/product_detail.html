{% extends 'base.html' %} {% load static %} {% block content %}

<section class="product-detail py-5">
  <div class="container">
    <div class="row align-items-center g-5">
      <!-- Product Image -->
      <div class="col-12 col-md-6">
        <img
          src="{{ product.image.url }}"
          alt="{{ product.name }}"
          class="img-fluid product-detail-image"
        />
      </div>

      <!-- Product Information -->
      <div class="col-12 col-md-6">
        <p class="text-uppercase fw-semibold text-muted">
          {{ product.category.name }}
        </p>

        <h1 class="display-5 fw-bold">{{ product.name }}</h1>

        <p class="lead">{{ product.description }}</p>

        <h3 class="mb-4">₹{{ product.price }}</h3>

        <form method="POST" action="{% url 'add_to_cart' product.pk %}">
          {% csrf_token %}

          <button type="submit" class="btn hero-button btn-lg">
            Add to Cart
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

{% endblock %}
