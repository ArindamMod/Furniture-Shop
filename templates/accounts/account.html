{% extends 'base.html' %} {% block content %}

<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="border rounded p-4 bg-white">
          <div class="text-center mb-4">
            <h1 class="h3 fw-bold">My Account</h1>

            <p class="text-muted">Welcome back, {{ user.username }}.</p>
          </div>

          <div class="mb-3">
            <strong>Username:</strong>
            {{ user.username }}
          </div>

          <div class="mb-4">
            <strong>Email:</strong>
            {{ user.email }}
          </div>

          <div class="d-grid mb-3">
            <a href="{% url 'my_orders' %}" class="btn btn-outline-secondary">
              My Orders
            </a>
          </div>

          <div class="d-grid">
            <a href="{% url 'logout' %}" class="btn hero-button"> Logout </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
