{% extends 'base.html' %} {% block content %}

<section class="order-success-page py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="order-success-card text-center">
          <!-- Success Icon -->
          <div class="order-success-icon">✓</div>

          <p class="order-success-label">ORDER CONFIRMED</p>

          <h1>Order Placed Successfully!</h1>

          <p class="order-success-message">Thank you for shopping with us.</p>

          <div class="order-number">
            <span>Order Number</span>

            <strong> #{{ order.id }} </strong>
          </div>

          <p class="order-success-status">
            Your payment has been confirmed and your order is being processed.
          </p>

          <div class="order-success-actions">
            <a href="{% url 'my_orders' %}" class="btn hero-button">
              View My Orders
            </a>

            <a href="{% url 'home' %}" class="btn order-secondary-button">
              Continue Shopping
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
