{% extends 'base.html' %}

{% block content %}

<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="border rounded p-4 bg-white">

                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold">
                            Create an Account
                        </h1>

                        <p class="text-muted">
                            Register to start shopping with us.
                        </p>
                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn hero-button w-100"
                        >
                            Register
                        </button>

                    </form>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a href="{% url 'login' %}">
                            Login
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
